services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    command: sh -c "pip install --no-cache-dir mlflow==2.19.0 psycopg[binary]==3.2.3 && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg://postgres:postgres@postgres:5432/documind --default-artifact-root /mlflow/artifacts"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/documind
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info -Q documents
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/documind
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  qdrant_data:
  mlflow_data:
